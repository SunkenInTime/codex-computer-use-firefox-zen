name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm test
      - run: npm test --prefix npm
      - run: cargo test --locked --manifest-path native-host/Cargo.toml
      - name: Package extension and matching review source
        if: runner.os == 'Windows'
        run: npm run package
      - name: Pack npm installer
        if: runner.os == 'Windows'
        run: npm pack ./npm --pack-destination dist
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: release-candidate
          path: dist/*

  live-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-firefox@v1
        id: firefox
      - name: Real Firefox strict-CSP click, type, and lifecycle regression
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: npm run test:live
